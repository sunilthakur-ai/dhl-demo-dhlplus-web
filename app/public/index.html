    /* ── RTL (Arabic) input pill fix ───────────────────────────────── */

    /* Cognigy's CDN stylesheet loads AFTER this <style> block, so equal-
       specificity !important declarations lose.  Every RTL rule uses an
       extra ancestor (.webchat-input) to push specificity above Cognigy's.

       In RTL flex the order reverses: ◁ (send) lands LEFT, input RIGHT.
       Target: [◁ | اكتب رسالتك هنا... ]  ≡                            */

    /* Kill any gap between flex siblings (hamburger / form / send button) */
    [dir="rtl"] [data-cognigy-webchat-root] [data-cognigy-webchat].webchat .webchat-input {
      gap: 0 !important;
    }

      // Only append Close button if not already present

        sendBtn.disabled = true;

    const params = new URLSearchParams(window.location.search);

          startConversationButtonText: "ابدأ المحادثة",
          previousConversations: {

          }
        },
        behavior: {

      const chatUiArabic = {

        chatOptions: {

            commentPlaceholder: "اكتب ملاحظاتك هنا...",
            submitButtonText: "إرسال الملاحظات",

          },
          enableDeleteConversation: true
        },
        customTranslations: {
          conversations_options: "خيارات المحادثات",

          delete: "حذف",
          delete_anyway: "الحذف على أي حال",
          cancel: "إلغاء",
          ariaLabels: {
            chatOptions: "خيارات المحادثة",
            sendMessage: "إرسال الرسالة",
            thumbsUp: "تقييم إيجابي",
            thumbsDown: "تقييم سلبي"
          }
        }
      };

      const chatUiEnglish = {
        behavior: { inputPlaceholder: "Type something here..." },
        chatOptions: {
          enabled: true,
          title: "Chat options",
          rating: {
            enabled: "always",
            title: "Please rate your chat experience",
            commentPlaceholder: "Type something here...",
            submitButtonText: "Send feedback",
            eventBannerText: "Your feedback was submitted"
          },

        },
        customTranslations: {

          delete: "Delete",
          delete_anyway: "Delete anyway",
          cancel: "Cancel"
        }
      };

      function getPageLocale() {

      function isArabicPage() {

      }

      const useArabic = isArabicPage();

      const script = document.createElement("script");
    script.src = "https://github.com/Cognigy/Webchat/releases/latest/download/webchat.js";

      script.onload = function () {
        function updateChatPreviewText() {
          const preview = document.querySelector(

          );

          if (preview) {
            preview.textContent = useArabic

        }

        initWebchat(
      "https://endpoint-dhl-dev.cognigy.cloud/5f59f38debead99d136712057476f05d8413c628440060d60018602616decda4", //pre-uat		
		  //"https://endpoint-dhl-dev.cognigy.cloud/b17767ca41785aba2177423f5170aa543ac92ff504d41ccb5890c2bfb6173225", //dhl-dev
          //"https://endpoint-trial.cognigy.ai/d04b3cbb068893f1dff07e751f7e049c63c82ab4336f14bab1d9931db6d51dfd", //acn-dev
          //"https://endpoint-trial.cognigy.ai/f5d02567e00049c4486ceda454059fe9b39587d81c8d5ebf96a18ca9de18fd83",
          {
            settings: {
              ...(useArabic ? arabicSettings : englishSettings),
              ...(useArabic ? chatUiArabic : chatUiEnglish),
              layout: {
                enablePersistentMenu: true,
                persistentMenu: {
                  title: useArabic ? "الإجراءات" : "Quick Actions",
                  menuItems: useArabic ? arabicMenuItems : englishMenuItems
                }
              },
              getStartedData: {
                language: useArabic ? "ar-AR" : "en-AR",
                locale: useArabic ? "ar-AR" : "en-AR",
                direction: useArabic ? "rtl" : "ltr"
              },
              startBehavior: {
                startBehavior: "injection",
                getStartedPayload: "Hi",
                getStartedText: "",
                getStartedData: {
                  language: useArabic ? "ar-AR" : "en-AR",
                  locale: useArabic ? "ar-AR" : "en-AR",
                  direction: useArabic ? "rtl" : "ltr"
                }
              },
              behavior: {
                enableAIAgentNotice: true,
                AIAgentNoticeText: useArabic
                  ? "أنت الآن تتحدث مع وكيل ذكاء اصطناعي."
                  : "You're now chatting with an AI Agent.",
                inputPlaceholder: useArabic
                  ? "اكتب رسالتك هنا..."
                  : "Type something here..."
              },
              widgetSettings: {
                disableHtmlInput: true
              }
            }
          }
        ).then((webchat) => {
          window.cognigyWebchat = webchat;

          
          updateChatPreviewText();

          const previewObserver = new MutationObserver(() => {
            const preview = document.querySelector(
              ".webchat-unread-message-preview-text"
            );

            if (preview) {
              preview.textContent = useArabic
                ? "لنبدأ المحادثة"
                : "Chat with me";

              previewObserver.disconnect();
            }
          });

          previewObserver.observe(document.body, {
            childList: true,
            subtree: true
          });


          // Replace 3 dots menu button with cog icon
          const scopedObserver = new MutationObserver(() => {
            const menuBtn = document.querySelector('[data-header-menu-button="true"]');
            if (menuBtn && menuBtn.dataset.cogReplaced !== "true") {
              menuBtn.dataset.cogReplaced = "true";
              menuBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#1A1A1A" d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.74-.07-1.08l2.32-1.82c.21-.16.27-.46.13-.7l-2.2-3.81c-.13-.25-.42-.33-.67-.25l-2.74 1.1c-.57-.44-1.18-.81-1.86-1.08L14 2.42C13.96 2.18 13.74 2 13.5 2h-4.4c-.24 0-.46.18-.5.42l-.41 2.44c-.68.27-1.3.64-1.86 1.08L3.59 4.84c-.25-.08-.54 0-.67.25L.72 8.9c-.14.24-.08.54.13.7l2.32 1.82C3.13 11.76 3.1 12.1 3.1 12.5s.03.74.07 1.08L.85 15.4c-.21.16-.27.46-.13.7l2.2 3.81c.13.25.42.33.67.25l2.74-1.1c.57.44 1.18.81 1.86 1.08l.41 2.44c.04.24.26.42.5.42h4.4c.24 0 .46-.18.5-.42l.41-2.44c.68-.27 1.3-.64 1.86-1.08l2.74 1.1c.25.08.54 0 .67-.25l2.2-3.81c.14-.24.08-.54-.13-.7l-2.32-1.82Z"/>
                </svg>
              `;
            }
          });

          const headerObserver = new MutationObserver(() => {
            const header = document.querySelector('.webchat-header-bar');
            if (header) {
              headerObserver.disconnect();
              scopedObserver.observe(header, { childList: true, subtree: true });
            }
          });

          headerObserver.observe(document.body, { childList: true, subtree: true });

          // RTL pill fix — Cognigy's CDN CSS loads after our <style> and wins
          // equal-specificity !important clashes.  Inline !important beats it all.
          if (useArabic) {
            const BORDER = "1px solid #D1D1D1";
            const set = (el, prop, val) => el && el.style.setProperty(prop, val, "important");

            function applyRtlPill() {
              const sendBtn = document.querySelector(".webchat-input-button-send");
              const box     = document.querySelector(".webchat-input-message-container");
              if (!sendBtn || !box) return;

              const inputBar = document.querySelector(".webchat-input");
              const form     = document.querySelector(".webchat-input-menu-form");

              // No flex gap anywhere along the bar
              set(inputBar, "gap", "0");
              set(form, "gap", "0");
              set(form, "margin", "0");
              set(sendBtn, "margin", "0");
              set(box, "margin", "0");

              if (form && form.contains(sendBtn) && form.contains(box)) {
                // Form wraps both → make the FORM itself the single pill.
                // overflow:hidden clips the children, so no seam is possible.
                set(form, "border", BORDER);
                set(form, "border-radius", "16px");
                set(form, "overflow", "hidden");
                set(form, "background-color", "#FFFFFF");
                set(form, "padding", "0");

                set(box, "border", "none");
                set(box, "border-radius", "0");
                set(sendBtn, "border", "none");
                set(sendBtn, "border-radius", "0");
              } else {
                // Send button is a sibling → butt two caps together.
                set(sendBtn, "border-radius", "16px 0 0 16px");
                set(sendBtn, "border-top", BORDER);
                set(sendBtn, "border-left", BORDER);
                set(sendBtn, "border-bottom", BORDER);
                set(sendBtn, "border-right", "none");

                set(box, "border-radius", "0 16px 16px 0");
                set(box, "border-top", BORDER);
                set(box, "border-right", BORDER);
                set(box, "border-bottom", BORDER);
                set(box, "border-left", "none");

                // Overlap 1px so no hairline shows even with sub-pixel rounding
                set(sendBtn, "margin-right", "-1px");
                set(sendBtn, "position", "relative");
                set(sendBtn, "z-index", "1");
              }
            }

            applyRtlPill();
            // Stay connected: React re-renders wipe inline styles, so re-apply.
            // Only childList/subtree are observed, so our style writes can't loop.
            new MutationObserver(applyRtlPill)
              .observe(document.body, { childList: true, subtree: true });
          }

          // ── Idle timeout ─────────────────────────────────────────────────
          const IDLE_CLOSE_MS = 5 * 60 * 1000;  // 5 min idle → close

          let idleCloseTimer = null;
          let isChatOpen     = false;
          let idleEnded      = false;

          function injectBotMessage(text) {
            // Try direct class first, then fall back to parent of any existing message row
            let chatLog = document.querySelector('.webchat-chat-history');
            if (!chatLog) {
              const existingRow = document.querySelector('.webchat-message-row');
              if (existingRow) chatLog = existingRow.parentElement;
            }
            if (!chatLog) {
              chatLog = document.querySelector('[class*="chat-history"]') ||
                        document.querySelector('[class*="message-list"]');
            }
            if (!chatLog) {
              console.warn('[IdleTimeout] chat log container not found');
              return;
            }

            const row = document.createElement('div');
            row.className = 'webchat-message-row bot';
            row.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;margin:8px 0;padding:0 16px;';

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.style.cssText = 'background-color:#fff;border:0.5px solid rgba(0,0,0,0.29);border-radius:0 12px 12px 12px;padding:12px 16px;max-width:340px;font-size:16px;color:#000;font-family:Delivery,sans-serif;';
            bubble.textContent = text;

            row.appendChild(bubble);
            chatLog.appendChild(row);
            bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }

          function clearIdleTimers() {
            clearTimeout(idleCloseTimer);
            idleCloseTimer = null;
          }

          function resetIdleTimers() {
            if (!isChatOpen || idleEnded) return;
            clearIdleTimers();
            idleCloseTimer = setTimeout(closeIdleSession, IDLE_CLOSE_MS);
          }

          function closeIdleSession() {
            if (idleEnded) return;
            idleEnded = true;
            conversationEnded = true;  // ensure webchat/close cleanup fires
            clearIdleTimers();
            const msg = useArabic
              ? 'نظراً لعدم النشاط، سيتم الآن إغلاق جلسة المحادثة هذه. شكراً لتواصلك مع DHL Express. يسعدنا خدمتك في أي وقت.'
              : 'Due to inactivity, this chat session will now be closed. Thank you for contacting DHL Express. You are welcome to start a new conversation anytime you need assistance.';
            injectBotMessage(msg);
            setTimeout(disableInput, 500);
          }
          // ─────────────────────────────────────────────────────────────────

          // Track whether conversation has ended
          let conversationEnded = false;

          // startBehavior:"injection" auto-opens the chat, so webchat/open fires
          // during initWebchat() — before our registerAnalyticsService listener is
          // wired up.  Start the timer here directly so we never miss it.
          isChatOpen = true;
          if (sessionStorage.getItem(ENDED_KEY)) {
            // Session was ended before this page load (e.g. after idle close + minimize)
            conversationEnded = true;
            idleEnded = true;
            setTimeout(disableInput, 400);
          } else {
            resetIdleTimers();
          }

          webchat.registerAnalyticsService((event) => {
            console.log("[Cognigy Event]", event);

            // Typing indicator events
            if (event?.payload?.data?.showTypingIndicator) {
              setTimeout(setIndicatorVisibility, DELAY, true);
            } else if (event?.payload?.data?.hideTypingIndicator) {
              setTimeout(setIndicatorVisibility, DELAY, false);
            }

            // Idle timeout: start/restore timer when chat opens
            if (event.type === "webchat/open") {
              isChatOpen = true;
              if (conversationEnded || sessionStorage.getItem(ENDED_KEY)) {
                // Re-apply disabled state — Cognigy re-rendered the DOM after minimize
                conversationEnded = true;
                idleEnded = true;
                setTimeout(disableInput, 400);
              } else {
                // Fresh session — remove any residual ended style from previous session
                cleanupEndedState();
                idleEnded = false;
                resetIdleTimers();
              }
            }

            // Idle timeout: reset timer when user sends a message
            if (event.type === "webchat/outgoing-message") {
              if (isChatOpen && !idleEnded) {
                resetIdleTimers();
              }
            }

            // End conversation event
            if (event.type === "webchat/incoming-message") {
              const text = event?.payload?.text;
              if (
                text &&
                (text.includes("You can now close the chat widget") ||
                text.includes("يمكنك الآن إغلاق نافذة المحادثة"))
              ) {
                conversationEnded = true;
                idleEnded = true;  // prevent idle timer from firing after bot closes
                clearIdleTimers();
                disableInput();
              }
            }

            // Clear timers on chat close; reset session only when conversation truly ended
            if (event.type === "webchat/close") {
              isChatOpen = false;
              clearIdleTimers();
              if (conversationEnded) {
                cleanupEndedState();
                window.cognigyWebchat.endSession();
                conversationEnded = false;
                idleEnded = false;
                console.log("Session reset after conversation ended");
              }
            }
          });
        });
      };

      document.body.appendChild(script);
    }
  </script>
